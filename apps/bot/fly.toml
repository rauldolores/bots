# Voice Gateway (F7) — solo el canal de llamadas de Twilio. El resto del bot
# (Telegram, WhatsApp, /admin, cola, crons) sigue en Vercel; ver Dockerfile y
# src/runtime/node.ts (VOICE_ONLY=1, se setea abajo).
app = "nodia-voice"
primary_region = "dfw"

[build]

[env]
  PORT = "8080"
  VOICE_ONLY = "1"
  # Este proceso ES el servidor de voz: el TwiML tiene que mandar el media
  # stream aquí, y el panel (que vive en Vercel) tiene que enseñar ESTA url
  # como webhook de "A CALL COMES IN". Ver channels/voice/baseUrl.ts.
  VOICE_PUBLIC_BASE_URL = "https://nodia-voice.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
