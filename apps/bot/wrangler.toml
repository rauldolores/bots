# Configuración de Cloudflare Workers.
#
# Este archivo viene listo para desplegar: `git clone` → `npm run deploy:cf`.
# Antes traía placeholders ({{BOT_SLUG}}) que rellenaba el instalador, y wrangler
# ni siquiera podía leerlo — un resto del modelo viejo, cuando el código se
# distribuía como artefacto en vez de clonarse.
#
# Cambia `name` si vas a correr más de un bot en la misma cuenta: es lo que
# decide el subdominio (https://<name>.<cuenta>.workers.dev) y dos bots con el
# mismo nombre se pisan.

name = "nodia-agents"
main = "src/runtime/cloudflare.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI: en Cloudflare cubre los embeddings de la base de conocimiento y la
# transcripción de notas de voz, sin llave de OpenAI aparte.
[ai]
binding = "AI"

# Aquí ya no hay Durable Object, D1, Vectorize ni R2. Los datos, la búsqueda
# vectorial y la cola del agente viven en Supabase, a la que se llega con el
# secret DATABASE_URL. Ver docs/portabilidad.md.

[vars]
BOT_NAME = "Asistente"
BUSINESS_NAME = "Mi Negocio"
BOT_LANGUAGE = "es"
BOT_TIER = "free"  # 'free' | 'pro'
BUFFER_SECONDS = "15"
# Vacío = el bot usa su propio origin. Ponlo solo si sirves el panel tras un
# dominio propio; si no, los enlaces del panel se arman solos.
DASHBOARD_BASE_URL = ""

# Secrets (con `wrangler secret put <NOMBRE>` — nunca los escribas aquí):
#   DATABASE_URL               obligatorio — cadena de conexión de Supabase
#                              (Project Settings → Database → Connection string).
#                              Usa el POOLER (puerto 6543): las funciones
#                              efímeras agotan una conexión directa.
#   ANTHROPIC_API_KEY          obligatorio — el cerebro (o OPENAI/XAI)
#   DASHBOARD_PASSWORD         obligatorio — Basic Auth de /admin (usuario: admin)
#   KB_REINDEX_TOKEN           obligatorio — protege POST /kb/reindex
#   TICK_TOKEN                 no hace falta en Cloudflare: el cron invoca el
#                              handler directo, sin pasar por HTTP.
#   TELEGRAM_BOT_TOKEN         por canal — Telegram
#   MANYCHAT_API_KEY           por canal — ManyChat
#   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_WA_FROM   por canal — WhatsApp vía Twilio
#   WHATSAPP_PHONE_NUMBER_ID / WHATSAPP_ACCESS_TOKEN / WHATSAPP_VERIFY_TOKEN /
#   WHATSAPP_APP_SECRET        por canal — WhatsApp Cloud API (Meta)
#   META_PAGE_ACCESS_TOKEN / META_VERIFY_TOKEN / META_APP_SECRET   por canal — Messenger e Instagram
#   CALCOM_API_KEY             opcional — agenda real en scheduleAppointment
#   RESEND_API_KEY             opcional — aviso al dueño por correo
#   OWNER_EMAIL                a dónde avisarte cuando el bot necesite un humano
#   OWNER_TELEGRAM_CHAT_ID     aviso por Telegram (dale /start a tu propio bot)
#   CONTROL_PLANE_TOKEN        opcional — Bearer que un control plane externo
#                              presenta para llamar /api/*

[triggers]
crons = [
  "* * * * *",   # cada minuto: red de seguridad de la cola del agente
  "0 3 * * *",   # 3am UTC: purga, insights y flywheel
]
