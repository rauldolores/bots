# Member replaces {{BOT_SLUG}} via the skill /configurar-mi-chatbot.
# DO NOT commit member-specific values to git.

name = "horizontes-bot-{{BOT_SLUG}}"
main = "src/runtime/cloudflare.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

# El Durable Object se eliminó (F3): el buffer de mensajes, el estado del
# agente y el temporizador de 15s viven ahora en Postgres. Ver
# docs/portabilidad.md.

# D1, Vectorize y R2 se eliminaron: los datos y la búsqueda vectorial viven en
# Supabase, a la que se llega con el secret DATABASE_URL. Ver docs/portabilidad.md.

[vars]
BOT_NAME = "{{BOT_NAME}}"
BUSINESS_NAME = "{{BUSINESS_NAME}}"
BOT_LANGUAGE = "{{BOT_LANGUAGE}}"
BOT_TIER = "{{BOT_TIER}}"  # 'free' | 'pro'
BUFFER_SECONDS = "15"
DASHBOARD_BASE_URL = "https://horizontes-bot-{{BOT_SLUG}}.workers.dev"

# Secrets (set with `wrangler secret put <NAME>` — never commit values):
#   DATABASE_URL               required — cadena de conexión de Supabase
#                              (Project Settings → Database → Connection string).
#                              Usa el pooler (puerto 6543) para serverless.
#   ANTHROPIC_API_KEY          required — Claude API
#   DASHBOARD_PASSWORD         required (Pro) — HTTP Basic Auth for /admin (user: admin)
#   KB_REINDEX_TOKEN           required — guards POST /kb/reindex (header: X-Reindex-Token)
#   TICK_TOKEN                 optional — protege POST /tick. En Cloudflare no
#                              hace falta: el cron invoca el handler directo.
#   TELEGRAM_BOT_TOKEN         per-channel — Telegram bot
#   MANYCHAT_API_KEY           per-channel — ManyChat (Pro)
#   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_WA_FROM   per-channel — Twilio WhatsApp (Pro)
#   CALCOM_API_KEY             optional — scheduleAppointment (Pro)
#   GOOGLE_SERVICE_ACCOUNT_JSON  optional — Sheets export (Pro)
#   RESEND_API_KEY             optional — handoff email
#   OWNER_EMAIL                handoff email recipient
#   OWNER_TELEGRAM_CHAT_ID     handoff notification (default channel — owner /start's the bot)
#   OWNER_WA_NUMBER            handoff WhatsApp DM recipient (Pro)
#   TWILIO_HANDOFF_CONTENT_SID approved WhatsApp template SID for the handoff DM (Pro)
#   CONTROL_PLANE_TOKEN        optional (secret) — Bearer the hosted control plane presents to call /api/*
#                              set with: wrangler secret put CONTROL_PLANE_TOKEN
#   CONTROL_PLANE_URL          optional (var) — base URL of the control plane (future reports / license check)

[triggers]
crons = [
  "* * * * *",   # cada minuto: red de seguridad de la cola del agente
  "0 3 * * *",   # 3am UTC: purga, insights y flywheel
]

# DASHBOARD_PASSWORD  (secret) — HTTP Basic Auth password for the admin dashboard; username is always "admin".
# Set it with: wrangler secret put DASHBOARD_PASSWORD
